[package]
name = "hyperlight-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-level Rust host library for running sandbox guests across multiple backends."

[dependencies]
anyhow = "1"
bitflags = "2"
bytes = "1"
cap-std = "4.0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
url = "2"
wasmtime-wasi-http = { version = "44.0.0", optional = true }

[dev-dependencies]
futures-util = "0.3"
http-body = "1"
proptest = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["wasi-http"]
# Host-side outbound HTTP (`send_http_request`) via wasmtime-wasi-http. Enabled by default
# for the wasm/js backends. The Unikraft backend builds with this OFF so workerd doesn't
# pull the wasmtime stack into its V8 runtime; outbound HTTP there goes via the host.
wasi-http = ["dep:wasmtime-wasi-http"]
test-utils = []
