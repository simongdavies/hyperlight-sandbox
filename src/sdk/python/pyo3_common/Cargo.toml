[package]
name = "hyperlight-sandbox-pyo3-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared PyO3 helpers for hyperlight-sandbox backend crates"

[dependencies]
pyo3.workspace = true
# Path dep with `default-features = false`: pyo3_common only uses feature-independent core
# types (ArgType/ToolRegistry/ToolSchema), so it does not need the wasi-http/wasmtime stack.
# Disabling defaults here lets the wasmtime-free unikraft backend build without wasmtime; the
# wasm/js backends still pull the core with default features directly, so feature unification
# keeps wasmtime for them.
hyperlight-sandbox = { path = "../../../hyperlight_sandbox", default-features = false }
anyhow = "1"
serde_json = "1"
log = "0.4"
