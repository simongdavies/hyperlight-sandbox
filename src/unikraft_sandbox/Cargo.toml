[package]
name = "hyperlight-unikraft-sandbox"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "hyperlight-sandbox backend that runs guests inside Unikraft micro-VMs on Hyperlight."

[dependencies]
# Host-agnostic core of hyperlight-sandbox (the `Guest`/`GuestSandbox` traits + the shared
# capability model). A direct path dep (not workspace inheritance) so `default-features =
# false` actually takes effect — it drops the `wasi-http` feature (and the wasmtime stack);
# the Unikraft backend never does guest-side host HTTP, so consumers like workerd stay
# wasmtime-free.
hyperlight-sandbox = { path = "../hyperlight_sandbox", default-features = false }

# The embedded Hyperlight + Unikraft host library (lib name `hyperlight_unikraft`).
# RE-POINTED 2026-06-30 from the simongdavies/hyperlight-unikraft fork rev (atop the
# danbugs/hyperlight warm-start fork, which BREAKS post-restore guest execution on WHP) to
# the RELEASED crates.io crate, proven to execute + capture stdout on Windows/WHP.
# Package renamed `hyperlight-unikraft-host` (fork) -> `hyperlight-unikraft` (released); both
# expose lib `hyperlight_unikraft`, so `use hyperlight_unikraft::...` is unchanged.
# NOTE: the released API may differ from the fork's — the build surfaces the port gaps.
hyperlight-unikraft = "0.11.0"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
