[package]
name = "hyperlight-unikraft-sandbox"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "hyperlight-sandbox backend that runs guests inside Unikraft micro-VMs on Hyperlight."

[dependencies]
# Host-agnostic core of hyperlight-sandbox (the `Guest`/`GuestSandbox` traits + the shared
# capability model). A direct path dep (not workspace inheritance) so `default-features =
# false` actually takes effect — it drops the `wasi-http` feature (and the wasmtime stack);
# the Unikraft backend never does guest-side host HTTP, so consumers like workerd stay
# wasmtime-free.
hyperlight-sandbox = { path = "../hyperlight_sandbox", default-features = false }

# The embedded Hyperlight + Unikraft host library (lib name `hyperlight_unikraft`).
# Points at the simongdavies/hyperlight-unikraft fork branch `feat/plex-run-capture`: the
# RELEASED 0.11.0 base (off upstream/main, hyperlight-host 0.16.0, WHP-proven) PLUS the
# library run+capture work — `Sandbox::run_code(code)` for per-call code delivery (C1),
# with stdout in-band capture (C2) and a `from_snapshot` factory (D1) to follow. Pinned to
# the branch until upstreamed.
hyperlight-unikraft = { git = "https://github.com/simongdavies/hyperlight-unikraft", branch = "feat/plex-run-capture" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
